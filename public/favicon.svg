<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="fav-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Rounded Base Card -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#fav-bg)" filter="url(#fav-shadow)" />
  <rect x="9" y="9" width="82" height="82" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- Central Sparkles & Hub Icon -->
  <g transform="translate(50, 50)">
    <!-- Main 4-point star -->
    <path d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z" fill="url(#fav-glow)" />
    <!-- Small offset sparkle -->
    <path d="M 16,-16 Q 16,-8 24,-8 Q 16,-8 16,0 Q 16,-8 8,-8 Q 16,-8 16,-16 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="-14" cy="14" r="3" fill="#60a5fa" />
    <circle cx="16" cy="16" r="2.5" fill="#f472b6" />
  </g>
</svg>
